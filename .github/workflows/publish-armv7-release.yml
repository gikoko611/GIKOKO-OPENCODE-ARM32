name: Publish OpenTUI ARMv7 Termux Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful ARMv7 cross-build workflow run ID"
        required: true
        default: "44035306814"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful ARMv7 build artifact
        uses: actions/download-artifact@v4
        with:
          name: opentui-android-armv7-experiment
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Prepare individual release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifact -maxdepth 1 -type f -print
          cp artifact/* release-assets/
          test -s release-assets/libopentui-android-armv7.so
          test -s release-assets/test-opentui-armv7.sh
          test -s release-assets/node-opentui-load-smoke.mjs
          file release-assets/libopentui-android-armv7.so || true
          sha256sum release-assets/* > release-assets/SHA256SUMS
          cat > release-assets/TERMUX-INSTALL.txt <<'EOF'
          OpenTUI Android ARMv7 test build
          Device target: 32-bit ARM / Android / Termux
          Node requirement: Node.js 26.4.0 with --experimental-ffi
          
          In Termux, download the individual assets from this GitHub Release.
          Keep libopentui-android-armv7.so, node-opentui-load-smoke.mjs,
          and test-opentui-armv7.sh in the same directory.
          
          Run:
            chmod +x test-opentui-armv7.sh
            bash test-opentui-armv7.sh
          
          This is an isolated OpenTUI native-load test, not the complete
          OpenCode ARMv7 CLI. PTY and full application integration remain
          separate validation tasks.
          EOF

      - name: Publish individual assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: opentui-armv7-run${{ inputs.run_id }}
          name: OpenTUI Android ARMv7 — Run ${{ inputs.run_id }}
          body: |
            Successful ARMv7 native cross-build artifact from workflow run ${{ inputs.run_id }}.
            
            Assets are uploaded individually (no ZIP required). This is an isolated
            native library and smoke-test release, not yet a complete OpenCode CLI.
          draft: false
          prerelease: true
          files: release-assets/*
          fail_on_unmatched_files: true
