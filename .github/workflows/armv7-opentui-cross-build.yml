name: ARMv7 OpenTUI native cross-build experiment

on:
  # Manual only: OpenTUI v0.8.3 currently has a 64-bit-only native ABI.
  # Do not spend hosted runner time until the ARM32 ABI port is implemented.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/armv7-opentui-cross-build.yml"

permissions:
  contents: read

jobs:
  build-opentui-android-armv7:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install Android NDK for API 29
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub Ubuntu runner must provide ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          test -d "$SYSROOT/usr/include/arm-linux-androideabi"
          test -d "$SYSROOT/usr/lib/arm-linux-androideabi/29"
          CXX_SHARED="$(find "$SYSROOT/usr/lib/arm-linux-androideabi" -name libc++_shared.so -type f -print -quit)"
          if [ -z "$CXX_SHARED" ]; then
            echo "NDK libc++_shared.so for armeabi-v7a was not found" >&2
            find "$SYSROOT/usr/lib" -maxdepth 3 -name 'libc++*' -print >&2
            exit 1
          fi
          cp "$CXX_SHARED" "$GITHUB_WORKSPACE/libc++_shared-android-armv7.so"
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_SYSROOT=$SYSROOT"
            echo "ANDROID_CXX_LIB_DIR=$(dirname "$CXX_SHARED")"
          } >> "$GITHUB_ENV"
          file "$GITHUB_WORKSPACE/libc++_shared-android-armv7.so"
          cat > "$GITHUB_WORKSPACE/android-libc.txt" <<EOF
          include_dir=$SYSROOT/usr/include
          sys_include_dir=$SYSROOT/usr/include/arm-linux-androideabi
          crt_dir=$SYSROOT/usr/lib/arm-linux-androideabi/29
          cc_dir=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          static_crt_dir=
          msvc_lib_dir=
          kernel32_lib_dir=
          darwin_sdk_dir=
          EOF
          cat "$GITHUB_WORKSPACE/android-libc.txt"
          zig version

      - name: Fetch pinned OpenTUI source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.8.3 https://github.com/anomalyco/opentui.git opentui
          test -s opentui/packages/native/src/vendor/zig-deps.tar.gz
          sha256sum opentui/packages/native/src/vendor/zig-deps.tar.gz | tee opentui-vendor-sha256.txt

      - name: Patch OpenTUI translate-c include paths for Android
        working-directory: opentui/packages/native
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.zig")
          source = path.read_text()
          replacements = {
              '        .linux => {\n            module.linkSystemLibrary("dl", .{});\n            module.linkSystemLibrary("pthread", .{});\n            module.linkSystemLibrary("m", .{});\n        },':
                  '        .linux => {\n            // Android Bionic provides dl, pthread and libm through libc.\n            if (target.result.abi != .android) {\n                module.linkSystemLibrary("dl", .{});\n                module.linkSystemLibrary("pthread", .{});\n                module.linkSystemLibrary("m", .{});\n            }\n        },',
              '    miniaudio_translate.addIncludePath(b.path("src"));':
                  '    if (b.graph.environ_map.get("ANDROID_SYSROOT")) |sysroot| {\n'
                  '        miniaudio_translate.addSystemIncludePath(.{ .cwd_relative = b.pathJoin(&.{ sysroot, "usr/include/arm-linux-androideabi" }) });\n'
                  '        miniaudio_translate.addSystemIncludePath(.{ .cwd_relative = b.pathJoin(&.{ sysroot, "usr/include" }) });\n'
                  '    }\n'
                  '    miniaudio_translate.addIncludePath(b.path("src"));',
              '    yoga_translate.addIncludePath(yoga_dep.path(""));':
                  '    if (b.graph.environ_map.get("ANDROID_SYSROOT")) |sysroot| {\n'
                  '        yoga_translate.addSystemIncludePath(.{ .cwd_relative = b.pathJoin(&.{ sysroot, "usr/include/arm-linux-androideabi" }) });\n'
                  '        yoga_translate.addSystemIncludePath(.{ .cwd_relative = b.pathJoin(&.{ sysroot, "usr/include" }) });\n'
                  '    }\n'
                  '    yoga_translate.addIncludePath(yoga_dep.path(""));',
              '    module.addImport("context_abi_c", header.createModule());':
                  '    if (b.graph.environ_map.get("ANDROID_SYSROOT")) |sysroot| {\n'
                  '        header.addSystemIncludePath(.{ .cwd_relative = b.pathJoin(&.{ sysroot, "usr/include/arm-linux-androideabi" }) });\n'
                  '        header.addSystemIncludePath(.{ .cwd_relative = b.pathJoin(&.{ sysroot, "usr/include" }) });\n'
                  '    }\n'
                  '    module.addImport("context_abi_c", header.createModule());'
          }

          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one occurrence: {old}")
              source = source.replace(old, new, 1)

          path.write_text(source)
          print("Patched all three translate-c modules with Android NDK SYSTEM include paths.")
          PY
          grep -n -A5 -B2 'ANDROID_SYSROOT' build.zig

      - name: Prepare vendored Zig dependencies
        working-directory: opentui/packages/native
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/prepare-zig-deps.sh
          test -f zig-deps/.ready

      - name: Patch OpenTUI for 32-bit ARM ABI and atomics
        working-directory: opentui/packages/native
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          Path("src/atomic64_android.c").write_text("""#include <stdint.h>
          
          /* ARMv7 does not expose lock-free 64-bit atomics to Zig's std.atomic API.
           * Clang lowers these builtins to the Android ARMv7 atomic runtime sequence. */
          uint64_t ot_atomic_u64_load(const uint64_t *value) {
              return __atomic_load_n(value, __ATOMIC_RELAXED);
          }
          
          uint64_t ot_atomic_u64_fetch_add(uint64_t *value, uint64_t amount) {
              return __atomic_fetch_add(value, amount, __ATOMIC_RELAXED);
          }
          
          int ot_atomic_u64_compare_exchange(uint64_t *value, uint64_t *expected, uint64_t desired) {
              return __atomic_compare_exchange_n(value, expected, desired, 0,
                                                 __ATOMIC_RELAXED, __ATOMIC_RELAXED);
          }
          """)
          Path("src/atomic64.zig").write_text("""extern "c" fn ot_atomic_u64_load(value: *const u64) u64;
          extern "c" fn ot_atomic_u64_fetch_add(value: *u64, amount: u64) u64;
          extern "c" fn ot_atomic_u64_compare_exchange(value: *u64, expected: *u64, desired: u64) c_int;

          pub fn load(value: *const u64) u64 {
              return ot_atomic_u64_load(value);
          }

          pub fn fetchAdd(value: *u64, amount: u64) u64 {
              return ot_atomic_u64_fetch_add(value, amount);
          }

          pub fn compareExchange(value: *u64, expected: *u64, desired: u64) bool {
              return ot_atomic_u64_compare_exchange(value, expected, desired) != 0;
          }
          """)

          patch("src/context-handles.zig",
                'const std = @import("std");',
                'const std = @import("std");\nconst atomic64 = @import("atomic64.zig");')
          patch("src/context-handles.zig",
                'var last_context_id: std.atomic.Value(u64) = .init(0);',
                'var last_context_id: u64 = 0;')
          patch("src/context-handles.zig",
                '''        var id = last_context_id.load(.monotonic);
                  while (true) {
                      if (id == std.math.maxInt(u64)) return error.ContextLimit;
                      if (last_context_id.cmpxchgWeak(id, id + 1, .monotonic, .monotonic)) |current| {
                          id = current;
                      } else break;
                  }''',
                '''        var id = atomic64.load(&last_context_id);
                  while (true) {
                      if (id == std.math.maxInt(u64)) return error.ContextLimit;
                      var expected = id;
                      if (atomic64.compareExchange(&last_context_id, &expected, id + 1)) break;
                      id = expected;
                  }''')

          patch("src/utils.zig",
                'const std = @import("std");',
                'const std = @import("std");\nconst atomic64 = @import("atomic64.zig");')
          patch("src/utils.zig",
                'var paint_clock = std.atomic.Value(u64).init(0);',
                'var paint_clock: u64 = 0;')
          patch("src/utils.zig",
                'return paint_clock.fetchAdd(1, .monotonic) + 1;',
                'return atomic64.fetchAdd(&paint_clock, 1) + 1;')

          p = Path("src/audio.zig")
          s = p.read_text()
          if 'const atomic64 = @import("atomic64.zig");' not in s:
              s = s.replace('const std = @import("std");',
                            'const std = @import("std");\nconst atomic64 = @import("atomic64.zig");', 1)
          s, add_count = re.subn(
              r'@atomicRmw\(u64, &([A-Za-z0-9_\.]+), \.Add, ([A-Za-z0-9_\.]+), \.monotonic\)',
              r'atomic64.fetchAdd(&\1, \2)', s)
          s, load_count = re.subn(
              r'@atomicLoad\(u64, &([A-Za-z0-9_\.]+), \.monotonic\)',
              r'atomic64.load(&\1)', s)
          if add_count < 6 or load_count < 6:
              raise SystemExit(f"audio.zig: unexpected u64 atomic counts add={add_count}, load={load_count}")
          p.write_text(s)
          print(f"Replaced audio u64 atomics: fetch-add={add_count}, load={load_count}")

          patch("src/context-abi.zig",
                '    if (@sizeOf(usize) != 8) @compileError("The OpenTUI C ABI requires a 64-bit target");\n',
                '')
          patch("src/scene-record.zig",
                '    std.debug.assert(@sizeOf(usize) >= 8); // commandSize adds up to four u32 lengths.\n',
                '')

          p = Path("src/scene-record.zig")
          s = p.read_text()
          needle = '/// Unpadded byte count of a command record, after checking its fixed fields.\n'
          helpers = '''fn checkedSizeAdd(a: usize, b: usize) !usize {
              return std.math.add(usize, a, b) catch error.InvalidOptions;
          }

          fn checkedSizeMul(a: usize, b: usize) !usize {
              return std.math.mul(usize, a, b) catch error.InvalidOptions;
          }

          '''
          if s.count(needle) != 1:
              raise SystemExit("scene-record.zig: commandSize insertion point mismatch")
          s = s.replace(needle, helpers + needle, 1)
          replacements = {
              'return @sizeOf(c.ot_scene_record_draw) + @as(usize, draw.struct_size) + value.text_length + value.bottom_length;':
                  'const fixed_size = try checkedSizeAdd(@sizeOf(c.ot_scene_record_draw), @as(usize, draw.struct_size));\n            const text_size = try checkedSizeAdd(fixed_size, @as(usize, value.text_length));\n            return try checkedSizeAdd(text_size, @as(usize, value.bottom_length));',
              'return @sizeOf(c.ot_scene_record_grid) + (@as(usize, value.column_count) + value.row_count) * @sizeOf(i32);':
                  'const entries = try checkedSizeAdd(@as(usize, value.column_count), @as(usize, value.row_count));\n            const payload = try checkedSizeMul(entries, @sizeOf(i32));\n            return try checkedSizeAdd(@sizeOf(c.ot_scene_record_grid), payload);',
              'return @sizeOf(c.ot_scene_record_packed) + @as(usize, value.byte_count);':
                  'return try checkedSizeAdd(@sizeOf(c.ot_scene_record_packed), @as(usize, value.byte_count));',
              'return @sizeOf(c.ot_scene_record_supersample) + @as(usize, value.byte_count);':
                  'return try checkedSizeAdd(@sizeOf(c.ot_scene_record_supersample), @as(usize, value.byte_count));',
              'return @sizeOf(c.ot_scene_record_grayscale) + @as(usize, value.sample_count) * @sizeOf(f32);':
                  'const payload = try checkedSizeMul(@as(usize, value.sample_count), @sizeOf(f32));\n            return try checkedSizeAdd(@sizeOf(c.ot_scene_record_grayscale), payload);',
              'return @sizeOf(c.ot_scene_record_color_matrix) + @as(usize, value.mask_count) * @sizeOf(f32);':
                  'const payload = try checkedSizeMul(@as(usize, value.mask_count), @sizeOf(f32));\n            return try checkedSizeAdd(@sizeOf(c.ot_scene_record_color_matrix), payload);',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f"scene-record.zig: expected one expression: {old}")
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Use the NDK's prebuilt libc++ shared library. Zig 0.17's bundled
          # libc++/libunwind sub-build injects an unsupported hard-float flag
          # for Android ARMv7; the NDK runtime is already built for this ABI.
          p = Path("build.zig")
          s = p.read_text()
          old = '''    module.link_libcpp = true;
              module.addIncludePath(yoga_dep.path(""));'''
          new = '''    const target = module.resolved_target.?.result;
              if (target.os.tag == .linux and target.abi == .android) {
                  module.link_libcpp = false;
                  if (b.graph.environ_map.get("ANDROID_SYSROOT")) |sysroot| {
                      module.addSystemIncludePath(.{ .cwd_relative = b.pathJoin(&.{ sysroot, "usr/include/c++/v1" }) });
                  }
                  if (b.graph.environ_map.get("ANDROID_CXX_LIB_DIR")) |lib_dir| {
                      module.addLibraryPath(.{ .cwd_relative = lib_dir });
                  }
                  module.linkSystemLibrary("c++_shared", .{});
              } else {
                  module.link_libcpp = true;
              }
              module.addIncludePath(yoga_dep.path(""));'''
          if s.count(old) != 1:
              raise SystemExit("build.zig: Yoga libc++ patch point mismatch")
          s = s.replace(old, new, 1)

          old = '''    module.addOptions("build_options", build_options);
              addTranslatedCImports(b, module, optimize, target);'''
          new = '''    if (target.result.os.tag == .linux and target.result.abi == .android and target.result.cpu.arch == .arm) {
                  module.addCSourceFile(.{ .file = b.path("src/atomic64_android.c"), .flags = &.{"-std=c11"} });
              }
              module.addOptions("build_options", build_options);
              addTranslatedCImports(b, module, optimize, target);'''
          if s.count(old) != 1:
              raise SystemExit("build.zig: applyDependencies patch point mismatch")
          s = s.replace(old, new, 1)
          p.write_text(s)
          print("Applied ARMv7 ABI-size, checked scene-record arithmetic, C atomic shim, and NDK libc++ patches.")
          PY
      - name: Cross-compile with Android Bionic sysroot
        working-directory: opentui/packages/native
        shell: bash
        run: |
          set -euo pipefail
          export CPATH="$ANDROID_SYSROOT/usr/include/arm-linux-androideabi:$ANDROID_SYSROOT/usr/include"
          export C_INCLUDE_PATH="$CPATH"
          export CPLUS_INCLUDE_PATH="$CPATH"
          zig build --libc "$GITHUB_WORKSPACE/android-libc.txt" \
            -Dlibrary-target=arm-linux-android.29 \
            -Doptimize=ReleaseFast --summary all

      - name: Verify ELF32 ARM output and Android linkage
        working-directory: opentui/packages/native
        shell: bash
        run: |
          set -euo pipefail
          OUT="lib/arm-linux-android.29"
          test -d "$OUT"
          find "$OUT" -maxdepth 2 -type f -print
          LIB="$(find "$OUT" -type f -name 'libopentui.so' -print -quit)"
          test -n "$LIB"
          file "$LIB"
          readelf -h "$LIB" | tee "$GITHUB_WORKSPACE/opentui-elf-header.txt"
          readelf -d "$LIB" | tee "$GITHUB_WORKSPACE/opentui-dynamic-section.txt"
          grep -q 'Class:.*ELF32' "$GITHUB_WORKSPACE/opentui-elf-header.txt"
          grep -Eq 'Machine:.*ARM' "$GITHUB_WORKSPACE/opentui-elf-header.txt"
          if readelf -d "$LIB" | grep -Eqi 'libc\.so\.6|ld-linux'; then
            echo "ERROR: glibc dependency found in Android target" >&2
            exit 1
          fi
          cp "$LIB" "$GITHUB_WORKSPACE/libopentui-android-armv7.so"
          {
            echo "## OpenTUI Android ARMv7 cross-build"
            echo "- Native library compiled with the Android NDK API 29 Bionic sysroot."
            echo "- ELF32 ARM and no glibc dynamic dependency verified."
            echo "- Node FFI compatibility and on-device terminal rendering remain unverified."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opentui-android-armv7-experiment
          path: |
            libopentui-android-armv7.so
            opentui-elf-header.txt
            opentui-dynamic-section.txt
            opentui-vendor-sha256.txt
            android-libc.txt
            libc++_shared-android-armv7.so
          if-no-files-found: ignore
          retention-days: 14
