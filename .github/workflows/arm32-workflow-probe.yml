name: ARM32 workflow syntax probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arm32-workflow-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate ARMv7 workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/armv7-opentui-cross-build.yml


