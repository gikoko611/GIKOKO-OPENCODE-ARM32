name: ARMv7 prerequisite preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream Bun Android release architectures
        id: bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.github.com/repos/oven-sh/bun/releases/latest -o bun-release.json
          python3 - <<'PY'
          import json, os
          d=json.load(open("bun-release.json"))
          names=[a["name"] for a in d.get("assets",[])]
          print("Bun release:", d.get("tag_name"))
          android=[n for n in names if "android" in n.lower()]
          armv7=[n for n in names if any(x in n.lower() for x in ("armv7","armv7l","armhf","armv6"))]
          print("Android-related assets:", android or "(none explicitly named)")
          print("32-bit ARM assets:", armv7 or "(none)")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("armv7_asset="+("true" if armv7 else "false")+"\n")
          PY

      - name: Check Termux OpenTUI ARMv7 package
        id: opentui
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for package in @androidtui/core-android-arm @androidtui/core-android-armv7; do
            encoded="$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$package")"
            code="$(curl -sS -o /tmp/npm.json -w '%{http_code}' "https://registry.npmjs.org/$encoded")"
            echo "$package -> HTTP $code"
            [ "$code" = "200" ] && found=true
          done
          echo "available=$found" >> "$GITHUB_OUTPUT"

      - name: Check ARMv7 PTY assets
        id: pty
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.github.com/repos/bd-loser/bun-termux/releases/tags/bun-pty-v0.4.11 -o /tmp/bun-pty.json
          curl -fsSL https://api.github.com/repos/bd-loser/bun-termux/releases/tags/opencode-pty-v0.2.0 -o /tmp/opencode-pty.json
          python3 - <<'PY'
          import json, os
          docs=[json.load(open(p)) for p in ("/tmp/bun-pty.json","/tmp/opencode-pty.json")]
          names=[a["name"] for d in docs for a in d.get("assets",[])]
          arm=[n for n in names if any(x in n.lower() for x in ("armv7","armv7l","armhf","arm32"))]
          print("PTY assets:", names)
          print("ARMv7 PTY assets:", arm or "(none)")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("available="+("true" if arm else "false")+"\n")
          PY
      - name: Check project pins and summarize
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          v=json.load(open("versions.json"))
          print("Current OpenCode pin:", v.get("opencode"))
          print("Current Bun pin:", v.get("bunTermux",{}).get("version"))
          print("Current OpenTUI native pin:", v.get("opentui",{}).get("androidArm64Native"))
          print("Current PTY asset:", v.get("bunPty",{}).get("assetUrl"))
          print("Current PTY service:", v.get("ptyService",{}).get("assetUrl"))
          PY
          {
            echo "## ARMv7 preflight"
            echo ""
            echo "- Bun 32-bit ARM asset: `${{ steps.bun.outputs.armv7_asset }}`"
            echo "- OpenTUI ARMv7 npm package: `${{ steps.opentui.outputs.available }}`"
            echo "- PTY ARMv7 assets: `${{ steps.pty.outputs.available }}`"
            echo ""
            echo "A missing prerequisite blocks a native ARMv7 release. This check does not build or publish an ARM32 binary."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce ARMv7 prerequisites
        shell: bash
        env:
          BUN_ARMV7: ${{ steps.bun.outputs.armv7_asset }}
          OPENTUI_ARMV7: ${{ steps.opentui.outputs.available }}
          PTY_ARMV7: ${{ steps.pty.outputs.available }}
        run: |
          set -euo pipefail
          if [[ "$BUN_ARMV7" != true || "$OPENTUI_ARMV7" != true || "$PTY_ARMV7" != true ]]; then
            echo "::error::ARMv7 build blocked: required 32-bit runtime/native assets are missing. No ARM32 release will be produced."
            exit 1
          fi
          echo "All prerequisite assets detected. Continue with separate ARMv7 build validation."
