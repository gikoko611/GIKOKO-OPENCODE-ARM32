name: ARMv7 Auto CI Orchestrator

on:
  push:
    branches:
      - armv7/pty-forkexec-device-probe
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: armv7-auto-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch-native-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch all ARMv7 build and verification workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            opencode-node-runtime-baseline.yml
            armv7-opentui-cross-build.yml
            armv7-parcel-watcher-cross-build.yml
            armv7-ghostty-android-probe.yml
            armv7-persistent-pty-cross-build.yml
          )
          for workflow in "${workflows[@]}"; do
            echo "Dispatching $workflow for ref $GH_REF"
            code="$(curl -sS -o response.json -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPO/actions/workflows/$workflow/dispatches" \
              -d "{\"ref\":\"$GH_REF\"}")"
            if [ "$code" != "204" ]; then
              cat response.json
              echo "Dispatch failed for $workflow (HTTP $code)" >&2
              exit 1
            fi
          done
          echo "All five component workflows were dispatched successfully."
